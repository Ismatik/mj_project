# MJ platform. Start everything: docker compose up -d --build
# Settings come from .env (see .env.example).

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-mj}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mj}
  MEDIA_DIR: /app/media
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  DEMO_LOGIN_CODES: ${DEMO_LOGIN_CODES:-}
  SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
  WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
  WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
  WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID:-}
  WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-}
  WHATSAPP_TEST_TO: ${WHATSAPP_TEST_TO:-}
  SMS_API_KEY: ${SMS_API_KEY:-}
  INSTAGRAM_TOKEN: ${INSTAGRAM_TOKEN:-}
  PAYMENTS_API_KEY: ${PAYMENTS_API_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mj}
      TZ: Asia/Dushanbe
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # reachable from this machine only (local dev, backups)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies database migrations, then exits.
  migrate:
    build: { context: ., target: tools }
    image: mj-tools
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., target: web }
    image: mj-web
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes:
      - media:/app/media # uploaded photos
    expose: ["3000"]

  worker:
    build: { context: ., target: tools }
    image: mj-tools
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  # HTTPS in front of the app (automatic certificates for SITE_DOMAIN).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]

  # Daily database dumps into ./backups (7 daily, 4 weekly, 6 monthly kept).
  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-mj}
      POSTGRES_USER: ${POSTGRES_USER:-mj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      TZ: Asia/Dushanbe
    volumes:
      - ./backups:/backups
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  media:
  caddy-data:
  caddy-config:
